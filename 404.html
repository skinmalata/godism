<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Godism Church</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=index.html">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e0e10;
      color: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 560px; }
    .code {
      font-size: clamp(80px, 18vw, 160px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(120deg, #f6c34a, #f2a34a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: "Archivo", sans-serif;
    }
    h1 { font-size: clamp(22px, 4vw, 32px); margin: 18px 0 12px; }
    p { color: #a0a0a5; margin-bottom: 28px; line-height: 1.6; }
    a.btn {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 40px;
      background: linear-gradient(120deg, #f6c34a, #f2a34a);
      color: #0e0e10;
      font-weight: 700;
      text-decoration: none;
      font-size: 15px;
    }
    a.btn:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for has moved or no longer exists. Taking you home...</p>
    <a class="btn" href="index.html">Go to homepage</a>
  </div>
  <script>
    window.location.replace("index.html");
  </script>
</body>
</html>
